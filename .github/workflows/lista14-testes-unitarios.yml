name: Verificar Lista 14 - testes unitarios

on:
  push:
    paths:
      - 'Lista14/**'
      - '.github/workflows/lista14-testes-unitarios.yml'
  pull_request:
    paths:
      - 'Lista14/**'
      - '.github/workflows/lista14-testes-unitarios.yml'

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lista14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Lista14/pom.xml
      - name: Executar testes com Maven
        run: mvn --batch-mode --no-transfer-progress test
